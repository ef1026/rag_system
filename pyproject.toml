[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-system"
dynamic = ["version"]
authors = [
    {name = "ef1026"}
]
description = "FastAPI and Next.js teaching assistant built with LightRAG, RAG-Anything, and MinerU GPU parsing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "streamlit",
    "python-dotenv",
    "nest_asyncio",
    "protobuf==3.20.2",
    "google-api-core==2.19.2",
    "googleapis-common-protos==1.75.1",
    "proto-plus==1.24.0",
    "huggingface_hub",
    "lightrag-hku",
    "mineru[core]",
    "sentence-transformers",
    "tqdm",
    "pypdf",
    "PyMuPDF",
]

[project.optional-dependencies]
image = ["Pillow>=10.0.0"]
text = ["reportlab>=4.0.0"]
office = []  # Requires LibreOffice (external program)
markdown = [
    "markdown>=3.4.0",
    "weasyprint>=60.0",
    "pygments>=2.10.0",
]
all = [
    "Pillow>=10.0.0",
    "reportlab>=4.0.0",
    "markdown>=3.4.0",
    "weasyprint>=60.0",
    "pygments>=2.10.0"
]

[project.urls]
Homepage = "https://github.com/ef1026/rag_system"
Documentation = "https://github.com/ef1026/rag_system#readme"
Repository = "https://github.com/ef1026/rag_system"
Issues = "https://github.com/ef1026/rag_system/issues"

[tool.uv]
dev-dependencies = [
    "pytest>=6.0",
    "pytest-asyncio",
    "black",
    "isort",
    "flake8",
    "mypy",
    "openai",
    "python-dotenv",
]

[tool.setuptools.packages.find]
include = ["raganything*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "raganything.__version__"}

[tool.ruff]
target-version = "py310"
